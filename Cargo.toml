[workspace]
resolver = "3"
members = ["crates/*"]
# Crates kept by the platform with a patch, built as dependencies only.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
mimorya-core = { path = "crates/core" }
mimorya-db = { path = "crates/db" }
mimorya-agent = { path = "crates/agent" }
mimorya-connectors = { path = "crates/connectors" }
mimorya-api = { path = "crates/api" }
mimorya-extract = { path = "crates/extract" }
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
dotenvy = "0.15"
# Text of e-mails in the charset they declare (ADR-122).
encoding_rs = "0.8"
futures = "0.3"
# SMTP: the platform's own e-mails, and a person's sent through their
# company's server (ADR-205): TLS by rustls (ring, webpki roots). Its
# `tracing` feature stays off: it would write `AUTH PLAIN <credentials>`.
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls-tls"] }
regex = "1"
rmcp = { version = "3.5.1", features = ["client", "macros", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest"] }
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# The HTTP client of the MCP transport (rmcp): TLS configured explicitly (ring, webpki roots).
openidconnect = { version = "4.0.1", default-features = false }
# The QR code of a second factor's enrolment (ADR-203): drawn as SVG only,
# without the image renderer or any other dependency.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# A domain's proof read from its DNS (ADR-069): pure Rust, the system's resolver.
hickory-resolver = "0.26"
# Reading deposited documents (ADR-095), in the extraction process only:
# PDF text by pdf-extract over lopdf (the version it uses), Word archives
# inflated by zip, its XML read by quick-xml, the process's own limits set by
# rlimit.
lopdf = { version = "0.42", default-features = false }
pdf-extract = "0.12.1"
quick-xml = "0.42"
rlimit = "0.11"
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# SAML 2.0 sign-in (ADR-068): pure Rust, XML signatures by bergshamra over RustCrypto.
saml-rs = { version = "=0.6.1", default-features = false, features = ["crypto-rustcrypto"] }
reqwest-mcp = { package = "reqwest", version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# The mail servers a company names (IMAP, SMTP; ADR-205): TLS over the
# connection the platform opened itself, by rustls (ring, webpki roots), and
# the operator's proxy matched as the HTTP client matches it (hyper-util,
# the version reqwest uses).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy"] }
http = "1"
# IMAP (ADR-205): the Delta Chat client, over the connection the platform
# opened itself, without its default executor.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
# The errors of the parser async-imap reads the server with (imap-proto, used
# through async-imap), which the literal guard reads too (ADR-205).
nom = { version = "8", default-features = false }
# E-mails read from IMAP (ADR-205): Stalwart's parser, every character set
# (encoding_rs, already used for documents).
mail-parser = { version = "0.11", default-features = false, features = ["full_encoding"] }
# Certificates of the tests' simulated mail servers, made at their start.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
schemars = { version = "1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# The events of an MCP answer, parsed as the MCP library parses them (same version as rmcp).
sse-stream = "0.2.6"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
thiserror = "2"
unicode-normalization = "0.1"
unicode-properties = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
# TypeScript declarations of the API contract (apps/web/lib/api/contract.ts).
# `no-serde-warnings`: request bodies use serde attributes that only reading
# knows (`deserialize_with`), which ts-rs would report at every build. It
# silences every serde attribute ts-rs does not read, responses included
# (ADR-039).
ts-rs = { version = "12", features = ["uuid-impl", "no-serde-warnings"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The bridge of `log` records into `tracing`, set up by hand to drop the
# records of the libraries that would write secrets (ADR-205).
tracing-log = "0.2"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
validator = { version = "0.21", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Deflate stays fast in debug builds: tests build and read documents whose
# streams inflate beyond a gigabyte (ADR-095).
[profile.dev.package.zlib-rs]
opt-level = 3

# imap-proto with its nesting bounded: the parser would otherwise overflow the
# stack on a server's parentheses (ADR-205, vendor/imap-proto/MIMORYA.md).
[patch.crates-io]
imap-proto = { path = "vendor/imap-proto" }
