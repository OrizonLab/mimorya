# The reverse proxy already on a server, as the CI stands it in front of the
# production stack (ADR-225): what Nginx Proxy Manager writes for a proxy
# host forwarding to mimorya-web:3000, its name resolved at each request by
# the container's resolver, plus the block the guide gives its « Advanced »
# tab, included as it is.
server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $server mimorya-web;
    set $port 3000;

    location / {
        proxy_pass http://$server:$port$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include /etc/nginx/mimorya/api-location.conf;
}
