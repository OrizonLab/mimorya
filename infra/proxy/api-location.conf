# The API behind a reverse proxy already on the server (ADR-225): /api/
# reaches it without its prefix, the run events streamed as they come, a
# document of 10 MB taken. The API reads the last address of
# X-Forwarded-For as the client's (ADR-226), so it must be the one the
# connection comes from, on every path of the host: the web application
# relays /api/ to the API too, whatever its case (/API/ reaches it through
# « location / »). Nginx Proxy Manager takes X-Real-IP, which the client
# writes, for $remote_addr whenever it connects from a private address:
# `set_real_ip_from unix:` replaces, for this server, the addresses it
# trusts with none a TCP client can connect from; /api/ sends
# $realip_remote_addr alone all the same. Its name is resolved at each
# request, by Docker's resolver: nginx starts and reloads while the stack is
# stopped, without taking down the other sites it serves, and follows the
# API once recreated; a stopped API answers 502 within 5 s. Pasted as it is
# into Nginx Proxy Manager's « Advanced » tab, or included in the server
# block of an nginx in a container on mimorya-edge whose other paths reach
# mimorya-web:3000 (docs/INSTALLATION.md, annex).
set_real_ip_from unix:;

location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $mimorya_api mimorya-api:4000;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://$mimorya_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $realip_remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 20m;
}
