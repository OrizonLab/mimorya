# The API behind a reverse proxy already on the server (ADR-225): /api/
# reaches it without its prefix, the client's address appended to
# X-Forwarded-For (the API reads the last one), the run events streamed as
# they come, a document of 10 MB taken. Pasted as it is into Nginx Proxy
# Manager's « Advanced » tab, or included in an nginx server block whose
# other paths reach mimorya-web:3000 (docs/INSTALLATION.md, annex).
location /api/ {
    proxy_pass http://mimorya-api:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 20m;
}
