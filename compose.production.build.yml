# The production stack's images built from this checkout rather than
# downloaded (ADR-051), under local names that can never be taken for the
# published ones:
#   docker compose --env-file .env.production -f compose.production.yml \
#     -f compose.production.build.yml up -d --build
# The CI checks the stack built this way.
services:
  migrate:
    image: mimorya-api:local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile

  api:
    image: mimorya-api:local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile

  web:
    image: mimorya-web:production
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_DEMO_MODE: 'false'
