[package]
name = "mimorya-connectors"
description = "Connectors: the demo interventions connector and the MCP bridge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mcp-demo-docs"
path = "src/bin/mcp_demo_docs.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
encoding_rs.workspace = true
futures.workspace = true
mimorya-core.workspace = true
regex.workspace = true
reqwest-mcp.workspace = true
rmcp.workspace = true
rustls.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
validator.workspace = true
webpki-roots.workspace = true

[features]
# The demo documentation server over Streamable HTTP, for tests.
testing = ["dep:axum", "dep:ring", "rmcp/transport-streamable-http-server"]

[dependencies.axum]
workspace = true
optional = true

[dependencies.ring]
workspace = true
optional = true

[dev-dependencies]
mimorya-agent = { workspace = true, features = ["testing"] }
mimorya-connectors = { path = ".", features = ["testing"] }

[lints]
workspace = true
