name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mimorya
          POSTGRES_PASSWORD: mimorya
          POSTGRES_DB: mimorya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimorya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mimorya:mimorya@localhost:5432/mimorya_test
      TEST_DATABASE_APP_URL: postgres://mimorya_app:mimorya_app@localhost:5432/mimorya_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the application database role
        run: psql postgres://mimorya:mimorya@localhost:5432/mimorya -f infra/postgres/init.sql
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:all
      - name: Build the web application
        run: pnpm --filter @mimorya/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
