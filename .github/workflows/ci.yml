name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request's newer push cancels its former run. Each merge's run of
# main has its own group, so none waits on, replaces or cancels another:
# each merge's images are published from its run (named main only if it is
# still main's head, ADR-051), and a run cancelled saves no cache for the
# next.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# The jobs run side by side (ADR-199). The Rust tests are built once, by
# « Rust (build the tests) », which lists every test and packs the binaries
# for the jobs that run them: the unit tests in one, the PostgreSQL tests
# in eight shards, each with its own database. The end-to-end programs are
# built once too, for three Playwright shards, each against its own start
# of the API. « CI result », last, fails unless every job passed and every
# test listed ran once and passed: the one check a merge needs.

jobs:
  lint:
    name: Rust (format, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build:
    name: Rust (build the tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # Line tables only: three hundred test binaries with full debug
      # information fill the runner's disk (the linker then dies of a bus
      # error); a failing test still names its file and line.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The cache of the former single job, which built the same tests
          # with the same variables.
          shared-key: rust
          # Saving takes minutes the jobs waiting on this one would lose:
          # main's runs save it, pull requests start from it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # As many shards as the matrix of « integration » below.
      - name: Build the tests, list them, run the doctests, pack them
        run: infra/ci/build-tests.sh 8
      - name: Keep the lists of tests
        run: |
          mkdir -p target/ci/lists
          cp target/ci/inventory.tsv target/ci/lists/listed-rust.tsv
          cp target/ci/ran-doc.tsv target/ci/lists/ran-doc.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: tests-listed-rust
          path: target/ci/lists/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rust-tests-unit
          path: target/ci/archives/unit.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rust-tests-int-1
          path: target/ci/archives/int-1.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rust-tests-int-2
          path: target/ci/archives/int-2.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rust-tests-int-3
          path: target/ci/archives/int-3.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rust-tests-int-4
          path: target/ci/archives/int-4.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rust-tests-int-5
          path: target/ci/archives/int-5.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rust-tests-int-6
          path: target/ci/archives/int-6.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rust-tests-int-7
          path: target/ci/archives/int-7.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rust-tests-int-8
          path: target/ci/archives/int-8.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      # Out of the cache main's runs save.
      - name: Leave the archives out of the cache
        run: rm -rf target/ci

  unit:
    # The tests `cargo test --workspace` runs: those not ignored.
    name: Rust (unit tests)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    # As the former single job had it: a test not ignored may reach it too.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mimorya
          POSTGRES_PASSWORD: mimorya
          POSTGRES_DB: mimorya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimorya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mimorya:mimorya@localhost:5432/mimorya_test
      TEST_DATABASE_APP_URL: postgres://mimorya_app:mimorya_app@localhost:5432/mimorya_test
    steps:
      - uses: actions/checkout@v4
      - name: Create the application database role
        run: psql postgres://mimorya:mimorya@localhost:5432/mimorya -f infra/postgres/init.sql
      - uses: actions/download-artifact@v4
        with:
          name: rust-tests-unit
          path: target/ci/archives
      - name: Unpack the tests
        run: zstd -dc --long=30 target/ci/archives/unit.tar.zst | tar -xf -
      - name: Unit tests
        run: infra/ci/run-tests.sh target/ci/plans/unit.tsv unit target/ci/lists/ran-unit.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-ran-unit
          path: target/ci/lists/
          retention-days: 7

  integration:
    # The tests `cargo test-int` runs: the ignored ones, which need
    # PostgreSQL, one at a time. Each binary recreates the test database:
    # each shard has its own (ADR-199).
    name: Rust (PostgreSQL tests ${{ matrix.shard }}/8)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mimorya
          POSTGRES_PASSWORD: mimorya
          POSTGRES_DB: mimorya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimorya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mimorya:mimorya@localhost:5432/mimorya_test
      TEST_DATABASE_APP_URL: postgres://mimorya_app:mimorya_app@localhost:5432/mimorya_test
    steps:
      - uses: actions/checkout@v4
      - name: Create the application database role
        run: psql postgres://mimorya:mimorya@localhost:5432/mimorya -f infra/postgres/init.sql
      - uses: actions/download-artifact@v4
        with:
          name: rust-tests-int-${{ matrix.shard }}
          path: target/ci/archives
      - name: Unpack the tests
        run: zstd -dc --long=30 target/ci/archives/int-${{ matrix.shard }}.tar.zst | tar -xf -
      - name: Integration tests (PostgreSQL)
        run: >-
          infra/ci/run-tests.sh target/ci/plans/int-${{ matrix.shard }}.tsv int
          target/ci/lists/ran-int-${{ matrix.shard }}.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-ran-int-${{ matrix.shard }}
          path: target/ci/lists/
          retention-days: 7

  msrv:
    # The Rust version Cargo.toml promises (rust-version): what compiles on
    # the latest stable may use syntax it does not have.
    name: Rust 1.88 (minimal version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --all-targets --all-features

  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:web
      - name: Build the web application
        run: pnpm --filter @mimorya/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  e2e-build:
    name: End-to-end (build)
    # A system Playwright supports: `ubuntu-latest` may move to one whose
    # browser and libraries it cannot install yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The cache of the former end-to-end job, which built the same
          # programs.
          shared-key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # As the tests run them: built together, the seed would take the
      # example's development features and be built again.
      - name: Build the seed, the end-to-end API and the document reader
        run: |
          cargo build --bin mimorya-seed
          cargo build -p mimorya-api --example e2e_server
          cargo build -p mimorya-api --bin mimorya-extract
      - run: pnpm install --frozen-lockfile
      - name: Build the web application
        run: pnpm --filter @mimorya/web build
      - name: List the tests
        run: |
          mkdir -p target/ci/lists
          pnpm --filter @mimorya/web exec playwright test --list | tee target/ci/e2e-list.txt
          node infra/ci/tests.mjs e2e-listed target/ci/e2e-list.txt > target/ci/lists/listed-e2e.tsv
      - name: Pack the programs and the web application
        run: >-
          tar --exclude=apps/web/.next/cache -cf - target/debug/mimorya-seed
          target/debug/mimorya-extract target/debug/examples/e2e_server apps/web/.next
          | zstd -q -3 -T0 -o target/ci/e2e-build.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: tests-listed-e2e
          path: target/ci/lists/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-build
          path: target/ci/e2e-build.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Leave the archive out of the cache
        run: rm -rf target/ci

  e2e:
    name: End-to-end (Playwright ${{ matrix.shard }}/3)
    needs: e2e-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mimorya
          POSTGRES_PASSWORD: mimorya
          POSTGRES_DB: mimorya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimorya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_DATABASE_URL: postgres://mimorya:mimorya@localhost:5432/mimorya
      E2E_DATABASE_APP_URL: postgres://mimorya_app:mimorya_app@localhost:5432/mimorya
      # The API's programs and the web application come built (e2e-build).
      E2E_PREBUILT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Create the application database role
        run: psql postgres://mimorya:mimorya@localhost:5432/mimorya -f infra/postgres/init.sql
      - run: pnpm install --frozen-lockfile
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: pnpm --filter @mimorya/web exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: pnpm --filter @mimorya/web exec playwright install-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: e2e-build
          path: target/ci
      - name: Unpack the programs and the web application
        run: zstd -dc target/ci/e2e-build.tar.zst | tar -xf -
      - name: End-to-end tests
        run: >-
          pnpm --filter @mimorya/web e2e --shard=${{ matrix.shard }}/3 2>&1
          | tee target/ci/e2e-${{ matrix.shard }}.log
      - name: Keep the tests that passed
        if: always()
        run: |
          mkdir -p target/ci/lists
          node infra/ci/tests.mjs e2e-passed target/ci/e2e-${{ matrix.shard }}.log \
            > target/ci/lists/ran-e2e-${{ matrix.shard }}.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-ran-e2e-${{ matrix.shard }}
          path: target/ci/lists/
          retention-days: 7
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7

  docker:
    name: Docker images (demonstration and production stacks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Not secrets: the stacks only live for this job.
      DEMO_PASSWORD: ci-demo-${{ github.run_id }}
      MIMORYA_DOMAIN: localhost
      MIMORYA_TLS: internal
    steps:
      - uses: actions/checkout@v4
      - name: Choose the production stack's database passwords and master key
        run: |
          for name in POSTGRES_PASSWORD MIMORYA_APP_DB_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          # The stacks' audit logs are sealed under a key derived from it
          # (ADR-178): the backup test verifies them across a restore.
          key=$(openssl rand -base64 32)
          echo "::add-mask::$key"
          echo "MIMORYA_MASTER_KEY=$key" >> "$GITHUB_ENV"
      # Built from this checkout, under local names (ADR-051).
      - name: Build the images
        run: |
          docker compose -f compose.demo.yml -f compose.demo.build.yml build
          docker compose -f compose.production.yml -f compose.production.build.yml build
      - name: Only the proxy publishes ports
        run: |
          for file in compose.demo.yml compose.production.yml; do
            published=$(docker compose -f "$file" config --format json |
              jq '[.services | to_entries[] | select(.key != "proxy" and (.value.ports // []) != [])] | length')
            test "$published" = 0 || { echo "$file publishes ports besides the proxy" >&2; exit 1; }
          done
      - name: Start the demonstration stack
        run: docker compose -f compose.demo.yml -f compose.demo.build.yml up -d
      - name: Smoke test of the demonstration stack
        env:
          COMPOSE_FILE: compose.demo.yml:compose.demo.build.yml
        run: infra/docker/smoke-test.sh https://localhost
      - name: Logs of the demonstration stack
        if: always()
        run: docker compose -f compose.demo.yml -f compose.demo.build.yml logs --no-color | tail -n 200
      - name: Stop the demonstration stack
        run: docker compose -f compose.demo.yml -f compose.demo.build.yml down -v
      - name: The Caddyfile also reads with a public certificate (ACME)
        run: |
          adapted=$(docker run --rm -e MIMORYA_DOMAIN=mimorya.example.com \
            -e MIMORYA_TLS=exploitation@example.com \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine \
            caddy adapt --config /etc/caddy/Caddyfile)
          grep -q 'exploitation@example.com' <<<"$adapted"
      - name: The production database refuses a password unfit for a URL, creating nothing
        run: |
          if output=$(timeout 120 docker compose -f compose.production.yml run --rm --no-deps -T \
            -e POSTGRES_PASSWORD=Mot-de-passe-2026 db 2>&1); then
            echo "the database started with a refused password" >&2
            exit 1
          fi
          grep -q 'POSTGRES_PASSWORD: at least 16 letters and digits' <<<"$output" ||
            { echo "$output" >&2; exit 1; }
          left=$(docker run --rm --entrypoint ls -v mimorya-production_db-data:/data \
            pgvector/pgvector:pg16 -A /data)
          test -z "$left" || { echo "data left behind: $left" >&2; exit 1; }
      - name: Start the production stack
        run: docker compose -f compose.production.yml -f compose.production.build.yml up -d
      - name: Installation test of the production stack
        env:
          # The test creates a company, then deletes it (ADR-192).
          DISPOSABLE_STACK: 'yes'
          COMPOSE_FILE: compose.production.yml:compose.production.build.yml
        run: infra/docker/production-test.sh https://localhost
      - name: Install age (the backups' encryption)
        run: sudo apt-get update -q && sudo apt-get install -yq age
      - name: Backup and restore of the production stack
        env:
          # The test throws the stack's database away.
          DISPOSABLE_STACK: 'yes'
          COMPOSE_FILE: compose.production.yml:compose.production.build.yml
        run: infra/docker/backup-test.sh https://localhost
      - name: Logs of the production stack
        if: always()
        run: docker compose -f compose.production.yml -f compose.production.build.yml logs --no-color | tail -n 200

  result:
    # The check a merge requires (ADR-199): it fails if any job failed, was
    # cancelled or skipped, or if a test listed did not run once and pass.
    name: CI result
    if: always()
    needs: [lint, build, unit, integration, msrv, web, e2e-build, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" > /dev/null
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tests-*
          path: target/ci/lists
          merge-multiple: true
      - name: Every Rust test listed ran once, in its pass, and passed
        run: >-
          node infra/ci/tests.mjs verify target/ci/lists/listed-rust.tsv --
          target/ci/lists/ran-unit.tsv target/ci/lists/ran-int-*.tsv
      - name: Every end-to-end test listed ran once, and passed
        run: >-
          node infra/ci/tests.mjs verify target/ci/lists/listed-e2e.tsv --
          target/ci/lists/ran-e2e-*.tsv
      # Their count and digest, then the list: what a change of the CI
      # compares with the run before it.
      - name: Every test that ran, doctests included
        run: |
          node infra/ci/tests.mjs digest target/ci/lists/ran-*.tsv > target/ci/ran-all.txt
          head -n 1 target/ci/ran-all.txt
          echo "::group::The tests that ran"
          tail -n +2 target/ci/ran-all.txt
          echo "::endgroup::"
