name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request's newer push cancels its former run. Each merge's run of
# main has its own group, so none waits on, replaces or cancels another:
# each merge's images are published from its run (named main only if it is
# still main's head, ADR-051), and a run cancelled saves no cache for the
# next.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (format, lint, tests)
    runs-on: ubuntu-latest
    # About two hundred PostgreSQL test binaries: 20 to 28 minutes with a warm
    # cache, past 30 with a cold one; a job cancelled saves no cache, so the
    # next one starts cold too.
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mimorya
          POSTGRES_PASSWORD: mimorya
          POSTGRES_DB: mimorya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimorya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      TEST_DATABASE_URL: postgres://mimorya:mimorya@localhost:5432/mimorya_test
      TEST_DATABASE_APP_URL: postgres://mimorya_app:mimorya_app@localhost:5432/mimorya_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Create the application database role
        run: psql postgres://mimorya:mimorya@localhost:5432/mimorya -f infra/postgres/init.sql
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: Integration tests (PostgreSQL)
        run: cargo test-int

  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:web
      - name: Build the web application
        run: pnpm --filter @mimorya/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  e2e:
    name: End-to-end (Playwright)
    # A system Playwright supports: `ubuntu-latest` may move to one whose
    # browser and libraries it cannot install yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mimorya
          POSTGRES_PASSWORD: mimorya
          POSTGRES_DB: mimorya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimorya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_DATABASE_URL: postgres://mimorya:mimorya@localhost:5432/mimorya
      E2E_DATABASE_APP_URL: postgres://mimorya_app:mimorya_app@localhost:5432/mimorya
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Create the application database role
        run: psql postgres://mimorya:mimorya@localhost:5432/mimorya -f infra/postgres/init.sql
      # As the tests run them: built together, the seed would take the
      # example's development features and be built again.
      - name: Build the seed, the end-to-end API and the document reader
        run: |
          cargo build --bin mimorya-seed
          cargo build -p mimorya-api --example e2e_server
          cargo build -p mimorya-api --bin mimorya-extract
      - run: pnpm install --frozen-lockfile
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: pnpm --filter @mimorya/web exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: pnpm --filter @mimorya/web exec playwright install-deps chromium
      - name: Build the web application
        run: pnpm --filter @mimorya/web build
      - name: End-to-end tests
        run: pnpm --filter @mimorya/web e2e
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  docker:
    name: Docker images (demonstration and production stacks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Not secrets: the stacks only live for this job.
      DEMO_PASSWORD: ci-demo-${{ github.run_id }}
      MIMORYA_DOMAIN: localhost
      MIMORYA_TLS: internal
    steps:
      - uses: actions/checkout@v4
      - name: Choose the production stack's database passwords
        run: |
          for name in POSTGRES_PASSWORD MIMORYA_APP_DB_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      # Built from this checkout, under local names (ADR-051).
      - name: Build the images
        run: |
          docker compose -f compose.demo.yml -f compose.demo.build.yml build
          docker compose -f compose.production.yml -f compose.production.build.yml build
      - name: Only the proxy publishes ports
        run: |
          for file in compose.demo.yml compose.production.yml; do
            published=$(docker compose -f "$file" config --format json |
              jq '[.services | to_entries[] | select(.key != "proxy" and (.value.ports // []) != [])] | length')
            test "$published" = 0 || { echo "$file publishes ports besides the proxy" >&2; exit 1; }
          done
      - name: Start the demonstration stack
        run: docker compose -f compose.demo.yml -f compose.demo.build.yml up -d
      - name: Smoke test of the demonstration stack
        env:
          COMPOSE_FILE: compose.demo.yml:compose.demo.build.yml
        run: infra/docker/smoke-test.sh https://localhost
      - name: Logs of the demonstration stack
        if: always()
        run: docker compose -f compose.demo.yml -f compose.demo.build.yml logs --no-color | tail -n 200
      - name: Stop the demonstration stack
        run: docker compose -f compose.demo.yml -f compose.demo.build.yml down -v
      - name: The Caddyfile also reads with a public certificate (ACME)
        run: |
          adapted=$(docker run --rm -e MIMORYA_DOMAIN=mimorya.example.com \
            -e MIMORYA_TLS=exploitation@example.com \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine \
            caddy adapt --config /etc/caddy/Caddyfile)
          grep -q 'exploitation@example.com' <<<"$adapted"
      - name: The production database refuses a password unfit for a URL, creating nothing
        run: |
          if output=$(timeout 120 docker compose -f compose.production.yml run --rm --no-deps -T \
            -e POSTGRES_PASSWORD=Mot-de-passe-2026 db 2>&1); then
            echo "the database started with a refused password" >&2
            exit 1
          fi
          grep -q 'POSTGRES_PASSWORD: at least 16 letters and digits' <<<"$output" ||
            { echo "$output" >&2; exit 1; }
          left=$(docker run --rm --entrypoint ls -v mimorya-production_db-data:/data \
            pgvector/pgvector:pg16 -A /data)
          test -z "$left" || { echo "data left behind: $left" >&2; exit 1; }
      - name: Start the production stack
        run: docker compose -f compose.production.yml -f compose.production.build.yml up -d
      - name: Installation test of the production stack
        env:
          # The test leaves a company and its administrator behind.
          DISPOSABLE_STACK: 'yes'
          COMPOSE_FILE: compose.production.yml:compose.production.build.yml
        run: infra/docker/production-test.sh https://localhost
      - name: Logs of the production stack
        if: always()
        run: docker compose -f compose.production.yml -f compose.production.build.yml logs --no-color | tail -n 200
