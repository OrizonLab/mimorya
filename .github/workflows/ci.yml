name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (format, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mimorya
          POSTGRES_PASSWORD: mimorya
          POSTGRES_DB: mimorya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimorya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      TEST_DATABASE_URL: postgres://mimorya:mimorya@localhost:5432/mimorya_test
      TEST_DATABASE_APP_URL: postgres://mimorya_app:mimorya_app@localhost:5432/mimorya_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Create the application database role
        run: psql postgres://mimorya:mimorya@localhost:5432/mimorya -f infra/postgres/init.sql
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: Integration tests (PostgreSQL)
        run: cargo test-int

  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:web
      - name: Build the web application
        run: pnpm --filter @mimorya/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mimorya
          POSTGRES_PASSWORD: mimorya
          POSTGRES_DB: mimorya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimorya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_DATABASE_URL: postgres://mimorya:mimorya@localhost:5432/mimorya
      E2E_DATABASE_APP_URL: postgres://mimorya_app:mimorya_app@localhost:5432/mimorya
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Create the application database role
        run: psql postgres://mimorya:mimorya@localhost:5432/mimorya -f infra/postgres/init.sql
      # As the tests run them: built together, the seed would take the
      # example's development features and be built again.
      - name: Build the seed and the end-to-end API
        run: |
          cargo build --bin mimorya-seed
          cargo build -p mimorya-api --example e2e_server
      - run: pnpm install --frozen-lockfile
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: pnpm --filter @mimorya/web exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: pnpm --filter @mimorya/web exec playwright install-deps chromium
      - name: Build the web application
        run: pnpm --filter @mimorya/web build
      - name: End-to-end tests
        run: pnpm --filter @mimorya/web e2e
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
