# Private production stack (ADR-034): no demonstration data, every secret
# chosen at installation, behind Caddy. In an env file (kept out of the
# repository) or the environment:
#   POSTGRES_PASSWORD         owner of the schema (migrations)
#   MIMORYA_APP_DB_PASSWORD   the application's role (row-level security)
#                             both: 16 letters and digits at least (`openssl rand -hex 32`)
#   MIMORYA_DOMAIN            the name the stack is served on
#   MIMORYA_TLS               an e-mail address for a public certificate (ACME),
#                             or `internal` for Caddy's own local authority
#   MIMORYA_WORKERS           how many workers execute the runs (ADR-087): 1 by
#                             default, at least 1 (none would leave the runs queued)
#   MIMORYA_VERSION           the published images to run (ADR-051): a version
#                             (1.2.0) or a commit (sha-…); latest by default, the
#                             last commit of main. Run this file from the same
#                             version or commit: it mounts files of the checkout.
# then:
#   docker compose --env-file .env.production -f compose.production.yml pull
#   docker compose --env-file .env.production -f compose.production.yml up -d
#   docker compose --env-file .env.production -f compose.production.yml exec api \
#     mimorya-admin create-company --name … --slug … --admin-email … --admin-name …
# No image is built here: one that cannot be downloaded stops the stack. To
# build them from this checkout instead, add compose.production.build.yml.
#
# Only Caddy publishes ports; the database is reachable from the stack's own
# containers only, with its own project name and volume (apart from the
# development database's).
#
# The API and the runs are two services of the same image (ADR-087): `api`
# serves HTTP and queues the runs it starts, `worker` executes them and the
# background work. Workers may be added side by side (ADR-086): their
# number, MIMORYA_WORKERS (1 by default), belongs in the env file, so that
# every `up -d` keeps it.
name: mimorya-production

# What the API and the workers read alike: the same database, the same
# models, keys and mail relay (ADR-085).
x-backend-environment: &backend-environment
  MIMORYA_ENV: production
  DATABASE_APP_URL: postgres://mimorya_app:${MIMORYA_APP_DB_PASSWORD}@db:5432/mimorya
  WEB_ORIGIN: https://${MIMORYA_DOMAIN:?choose the domain the stack is served on (MIMORYA_DOMAIN)}
  # Unset: Anthropic if ANTHROPIC_API_KEY is, otherwise no model.
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  MIMORYA_MASTER_KEY: ${MIMORYA_MASTER_KEY:-}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # The passwords are checked before anything is created.
    entrypoint: ['bash', '/usr/local/bin/entrypoint-production.sh']
    command: ['postgres']
    environment:
      POSTGRES_USER: mimorya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?choose the schema owner's password (POSTGRES_PASSWORD)}
      POSTGRES_DB: mimorya
      MIMORYA_APP_DB_PASSWORD: ${MIMORYA_APP_DB_PASSWORD:?choose the application role's password (MIMORYA_APP_DB_PASSWORD)}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres/entrypoint-production.sh:/usr/local/bin/entrypoint-production.sh:ro
      - ./infra/postgres/init-production.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mimorya']
      interval: 5s
      timeout: 5s
      retries: 10

  # The migrations alone (owner role), then it stops.
  migrate:
    image: ghcr.io/orizonlab/mimorya-api:${MIMORYA_VERSION:-latest}
    command: ['mimorya-admin', 'migrate']
    environment:
      DATABASE_URL: postgres://mimorya:${POSTGRES_PASSWORD}@db:5432/mimorya
    depends_on:
      db:
        condition: service_healthy

  # Serves the API; the runs it starts wait queued for a worker. One only:
  # the rate limits are counted per process (SECURITY §4).
  api:
    image: ghcr.io/orizonlab/mimorya-api:${MIMORYA_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *backend-environment
      MIMORYA_ROLE: api
      TRUST_PROXY: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Executes the runs, queued ones included, and the background work;
  # serves nothing. A run still under way after the grace period is taken
  # up by another worker once its lease expires (ADR-083).
  worker:
    image: ghcr.io/orizonlab/mimorya-api:${MIMORYA_VERSION:-latest}
    restart: unless-stopped
    # How many, kept from one `up` to the next (a `--scale` lasts one).
    scale: ${MIMORYA_WORKERS:-1}
    stop_grace_period: 2m
    environment:
      <<: *backend-environment
      MIMORYA_ROLE: worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/orizonlab/mimorya-web:${MIMORYA_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      MIMORYA_DOMAIN: ${MIMORYA_DOMAIN}
      MIMORYA_TLS: ${MIMORYA_TLS:?an e-mail address for a public certificate, or internal (MIMORYA_TLS)}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
      - api

volumes:
  db-data:
  caddy-data:
