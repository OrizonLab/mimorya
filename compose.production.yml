# Private production stack (ADR-034): no demonstration data, every secret
# chosen at installation, behind Caddy. In an env file (kept out of the
# repository; .env.production.example describes every variable, ADR-221) or
# the environment:
#   POSTGRES_PASSWORD         owner of the schema (migrations)
#   MIMORYA_APP_DB_PASSWORD   the application's role (row-level security)
#                             both: 16 letters and digits at least (`openssl rand -hex 32`)
#   MIMORYA_MASTER_KEY        seals the companies' secrets (`openssl rand -base64 32`)
#   MIMORYA_DOMAIN            the name the stack is served on
#   MIMORYA_TLS               an e-mail address for a public certificate (ACME),
#                             or `internal` for Caddy's own local authority
#   MIMORYA_WORKERS           how many workers execute the runs (ADR-087): 1 by
#                             default, at least 1 (none would leave the runs queued)
#   MIMORYA_VERSION           the published images to run (ADR-051): a version
#                             (1.2.0) or a commit (sha-…); latest by default, the
#                             last commit of main. Run this file from the same
#                             version or commit: it mounts files of the checkout.
#   MIMORYA_BACKUP_RECIPIENTS the backups' age public keys (ADR-166): when given,
#                             every WAL segment is archived, encrypted for them
#                             (ADR-206), unset by default
#   MIMORYA_WAL_ARCHIVE       the host's folder of that archive, ./wal-archive by
#                             default; it becomes the database's (uid 999, 700)
# then:
#   docker compose --env-file .env.production -f compose.production.yml pull
#   docker compose --env-file .env.production -f compose.production.yml up -d
#   docker compose --env-file .env.production -f compose.production.yml exec api \
#     mimorya-admin create-company --name … --slug … --admin-email … --admin-name …
# No image is built here: one that cannot be downloaded stops the stack. To
# build them from this checkout instead, add compose.production.build.yml.
#
# Only Caddy publishes ports; the database is reachable from the stack's own
# containers only, with its own project name and volume (apart from the
# development database's).
#
# The API and the runs are two services of the same image (ADR-087): `api`
# serves HTTP and queues the runs it starts, `worker` executes them and the
# background work. Workers may be added side by side (ADR-086): their
# number, MIMORYA_WORKERS (1 by default), belongs in the env file, so that
# every `up -d` keeps it.
name: mimorya-production

# What the API and the workers read alike: the same database, the same
# models, keys and mail relay (ADR-085). Every variable the configuration
# reads is passed, with its default, but those this file fixes or the image
# holds (ADR-221, crates/api/tests/configuration_files.rs); what each one does:
# .env.production.example.
x-backend-environment: &backend-environment
  MIMORYA_ENV: production
  # Session cookies only over HTTPS: the stack is served by Caddy alone.
  SESSION_SECURE_COOKIE: 'true'
  DATABASE_APP_URL: postgres://mimorya_app:${MIMORYA_APP_DB_PASSWORD}@db:5432/mimorya
  WEB_ORIGIN: https://${MIMORYA_DOMAIN:?choose the domain the stack is served on (MIMORYA_DOMAIN)}
  # Seals the companies' keys and tokens, keys the audit chain's seals and
  # the rate limits' digests: without it, no company could keep its own
  # model key (the « client key » formula) nor link an account.
  MIMORYA_MASTER_KEY: ${MIMORYA_MASTER_KEY:?generate the master key (openssl rand -base64 32) and keep a copy off the server (MIMORYA_MASTER_KEY)}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # The brand people see (ADR-222): the assistant takes the product's name
  # when it has none, the interface keeps its accents when none is set.
  MIMORYA_PRODUCT_NAME: ${MIMORYA_PRODUCT_NAME:-Mimorya}
  MIMORYA_ASSISTANT_NAME: ${MIMORYA_ASSISTANT_NAME:-}
  MIMORYA_ACCENT_LIGHT: ${MIMORYA_ACCENT_LIGHT:-}
  MIMORYA_ACCENT_DARK: ${MIMORYA_ACCENT_DARK:-}
  # Where the api reads the logo and the favicon (mounted from the host).
  MIMORYA_BRAND_DIR: /etc/mimorya/brand
  LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
  MIMORYA_DOCUMENT_QUOTA_MB: ${MIMORYA_DOCUMENT_QUOTA_MB:-1024}
  # Unset: Anthropic if ANTHROPIC_API_KEY is, otherwise no model.
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
  MIMORYA_LLM_JUDGE: ${MIMORYA_LLM_JUDGE:-false}
  # Private model servers a company may choose (comma-separated).
  MIMORYA_TENANT_LLM_ENDPOINTS: ${MIMORYA_TENANT_LLM_ENDPOINTS:-}
  # The proxy the model providers, the embedding models and Jev are reached
  # through, if any: never what companies connect (MIMORYA_OUTBOUND_PROXY).
  HTTPS_PROXY: ${MIMORYA_MODEL_PROXY:-}
  NO_PROXY: ${MIMORYA_MODEL_NO_PROXY:-}
  # Anthropic's advisor, in beta: off unless the operator opens it (ADR-207).
  MIMORYA_ANTHROPIC_ADVISOR: ${MIMORYA_ANTHROPIC_ADVISOR:-false}
  # TypeSafe's Jev, a subprocessor outside the EU: off unless the operator
  # opens it (ADR-213).
  MIMORYA_TYPESAFE_JEV: ${MIMORYA_TYPESAFE_JEV:-false}
  MIMORYA_JEV_MODEL: ${MIMORYA_JEV_MODEL:-jev-1.14.0}
  MIMORYA_DECISION_TIMEOUT_MS: ${MIMORYA_DECISION_TIMEOUT_MS:-2000}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-}
  # What companies connect may reach: public servers only unless lifted, and
  # through the operator's proxy if any, which needs it lifted (ADR-162).
  MIMORYA_MCP_ALLOW_PRIVATE_NETWORK: ${MIMORYA_MCP_ALLOW_PRIVATE_NETWORK:-false}
  MIMORYA_OUTBOUND_PROXY: ${MIMORYA_OUTBOUND_PROXY:-}
  MIMORYA_OUTBOUND_NO_PROXY: ${MIMORYA_OUTBOUND_NO_PROXY:-}
  # How long an MCP server may take to start, and a person's turn wait for it.
  MIMORYA_MCP_START_TIMEOUT_SECS: ${MIMORYA_MCP_START_TIMEOUT_SECS:-20}
  MIMORYA_MCP_START_PATIENCE_SECS: ${MIMORYA_MCP_START_PATIENCE_SECS:-5}

services:
  # PostgreSQL 16 with pgvector, and age for the archive of its WAL (ADR-206).
  db:
    image: ghcr.io/orizonlab/mimorya-db:${MIMORYA_VERSION:-latest}
    restart: unless-stopped
    # The passwords, and the recipients if any, are checked before anything
    # is created.
    entrypoint: ['bash', '/usr/local/bin/entrypoint-production.sh']
    command: ['postgres']
    environment:
      POSTGRES_USER: mimorya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?choose the schema owner's password (POSTGRES_PASSWORD)}
      POSTGRES_DB: mimorya
      MIMORYA_APP_DB_PASSWORD: ${MIMORYA_APP_DB_PASSWORD:?choose the application role's password (MIMORYA_APP_DB_PASSWORD)}
      # Public keys: given, the WAL is archived, encrypted for them (ADR-206).
      MIMORYA_BACKUP_RECIPIENTS: ${MIMORYA_BACKUP_RECIPIENTS:-}
    volumes:
      - db-data:/var/lib/postgresql/data
      # On the host, where the operator copies it off site from.
      - ${MIMORYA_WAL_ARCHIVE:-./wal-archive}:/var/lib/postgresql/wal-archive
      - ./infra/postgres/entrypoint-production.sh:/usr/local/bin/entrypoint-production.sh:ro
      - ./infra/postgres/init-production.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./infra/postgres/archive-wal.sh:/usr/local/bin/archive-wal.sh:ro
      # Read from the archive in a restore to a point in time (ADR-214).
      - ./infra/postgres/restore-wal.sh:/usr/local/bin/restore-wal.sh:ro
      # Prunes the archive to what the base backups kept need (ADR-215).
      - ./infra/postgres/prune-wal.sh:/usr/local/bin/prune-wal.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mimorya']
      interval: 5s
      timeout: 5s
      retries: 10

  # The migrations alone (owner role), then it stops.
  migrate:
    image: ghcr.io/orizonlab/mimorya-api:${MIMORYA_VERSION:-latest}
    command: ['mimorya-admin', 'migrate']
    environment:
      DATABASE_URL: postgres://mimorya:${POSTGRES_PASSWORD}@db:5432/mimorya
    depends_on:
      db:
        condition: service_healthy

  # Serves the API; the runs it starts wait queued for a worker. One only:
  # the global rate limit is counted per process, the sign-in limits alone
  # being shared through PostgreSQL (ADR-088, SECURITY §4).
  api:
    image: ghcr.io/orizonlab/mimorya-api:${MIMORYA_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *backend-environment
      MIMORYA_ROLE: api
      TRUST_PROXY: 'true'
    volumes:
      # The brand's logo and favicon, checked when it starts (ADR-222); an
      # empty folder shows none.
      - ${MIMORYA_BRAND_FOLDER:-./brand}:/etc/mimorya/brand:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Executes the runs, queued ones included, and the background work;
  # serves nothing. A run still under way after the grace period is taken
  # up by another worker once its lease expires (ADR-083).
  worker:
    image: ghcr.io/orizonlab/mimorya-api:${MIMORYA_VERSION:-latest}
    restart: unless-stopped
    # How many, kept from one `up` to the next (a `--scale` lasts one).
    scale: ${MIMORYA_WORKERS:-1}
    stop_grace_period: 2m
    environment:
      <<: *backend-environment
      MIMORYA_ROLE: worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/orizonlab/mimorya-web:${MIMORYA_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      MIMORYA_DOMAIN: ${MIMORYA_DOMAIN}
      MIMORYA_TLS: ${MIMORYA_TLS:?an e-mail address for a public certificate, or internal (MIMORYA_TLS)}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
      - api

volumes:
  db-data:
  caddy-data:
